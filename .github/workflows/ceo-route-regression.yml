name: CEO API route regression

on:
  pull_request:
    paths:
      - "app/api/v1/api.py"
      - "app/api/v1/endpoints/ceo*.py"
      - "app/api/v1/endpoints/marketing.py"
      - "tests/test_ceo_v5_router_registration.py"
      - "requirements.txt"
      - ".github/workflows/ceo-route-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceo-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile API modules
        run: python -m compileall -q app/api/v1/api.py app/api/v1/endpoints/ceo.py app/api/v1/endpoints/ceo_v5.py app/api/v1/endpoints/marketing.py tests/test_ceo_v5_router_registration.py
      - name: Verify CEO v5 route registration
        env:
          ENVIRONMENT: test
          DEV: "true"
          SECRET_KEY: "test-only-secret-key-not-for-production"
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_ceo_v5_router_registration.py
