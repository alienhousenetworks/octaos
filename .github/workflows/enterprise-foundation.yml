name: Enterprise Foundation Security Tests
# Covers tenant isolation, production configuration, webhook ingress, credential provisioning and replay-key regression tests.

on:
  pull_request:
    paths:
      - "app/core/middleware.py"
      - "app/core/config.py"
      - "app/main.py"
      - "app/api/v2/api.py"
      - "app/api/v1/endpoints/integrations.py"
      - "app/services/integrations/webhook_security.py"
      - "app/services/durable_workflows.py"
      - "tests/test_durable_workflow_tenant_safety.py"
      - "app/models/workforce_events.py"
      - "app/services/workforce_event_service.py"
      - "app/services/autonomous_runtime/engine.py"
      - "alembic/env.py"
      - "alembic/versions/f9a0b1c2d3e4_workforce_events.py"
      - "tests/test_workforce_event_runtime_bridge.py"
      - "app/api/v1/endpoints/workforce_events.py"
      - "app/api/v1/api.py"
      - "tests/test_workforce_event_service.py"
      - "tests/test_tenant_middleware_context.py"
      - "tests/test_production_config.py"
      - "tests/test_health_response_sanitization.py"
      - "app/api/mcp_transport.py"
      - "app/api/v1/endpoints/mcp.py"
      - "app/services/mcp/**"
      - "tests/mcp/**"
      - "tests/test_webhook_security.py"
      - ".github/workflows/enterprise-foundation.yml"

permissions:
  contents: read

concurrency:
  group: enterprise-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      DEV: "true"
      ENVIRONMENT: "test"
      SECRET_KEY: "test-only-secret-key-32-characters-minimum"
      SQLALCHEMY_DATABASE_URI: "sqlite:///./test_enterprise_foundation.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile changed Python modules
        run: |
          python -m compileall -q app/core/middleware.py app/core/config.py app/main.py app/api/v2/api.py app/api/v1/endpoints/integrations.py app/services/integrations/webhook_security.py app/services/durable_workflows.py app/models/workforce_events.py app/services/workforce_event_service.py app/services/autonomous_runtime/engine.py app/api/v1/endpoints/workforce_events.py app/api/v1/api.py alembic/env.py alembic/versions/f9a0b1c2d3e4_workforce_events.py
      - name: Run enterprise foundation regression tests
        run: |
          pytest -q \
            tests/test_tenant_middleware_context.py \
            tests/test_production_config.py \
            tests/test_health_response_sanitization.py \
            tests/test_webhook_security.py \
            tests/test_security_passwords.py \
            tests/test_agent_runtime_protocol.py \
            tests/test_autonomous_runtime_idempotency.py \
            tests/test_durable_workflow_tenant_safety.py \
            tests/test_workforce_event_service.py \
            tests/test_workforce_event_runtime_bridge.py \
            tests/mcp/test_api_endpoints.py \
            tests/mcp/test_dynamic_mcp.py \
            tests/mcp/test_external_mcp_config.py \
            tests/mcp/test_external_mcp_interoperability.py
