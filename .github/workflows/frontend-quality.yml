name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches:
      - "design/enterprise-lime-frontend"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint changed UI files (advisory while repository lint backlog is addressed)
        continue-on-error: true
        run: >-
          npx eslint
          src/components/analytics/kpi-metric-card.tsx
          src/components/analytics/sparkline.tsx
          src/components/shell/app-shell.tsx
          src/components/shell/workforce-activity.tsx
          src/components/support-widget.tsx
          src/components/ui/badge.tsx
          src/components/views/dashboard-view.tsx
          src/components/views/enterprise-view.tsx
          src/components/views/orchestrator-charts.tsx
          src/components/views/support-view.tsx
          src/features/automations/canvas/workflow-canvas.tsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
        run: npm run build
