name: HR Enterprise Regression Tests

on:
  pull_request:
    paths:
      - "app/api/v1/endpoints/hr_*.py"
      - "app/models/hr_*.py"
      - "app/services/rbac_service.py"
      - "tests/hr/**"
      - "scripts/migrate_hr_enterprise_schema.py"
      - "requirements.txt"
      - ".github/workflows/hr-enterprise-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hr-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed Python modules
        run: python -m compileall -q app tests/hr scripts/migrate_hr_enterprise_schema.py
      - name: Run HR regression tests
        env:
          ENVIRONMENT: test
          DEV: "true"
          SECRET_KEY: "test-only-secret-key-not-for-production"
        run: pytest -q tests/hr
