name: Marketing Buffer Integration Tests

on:
  pull_request:
    paths:
      - "app/api/v1/endpoints/buffer_oauth.py"
      - "app/services/integrations/buffer_service.py"
      - "app/services/marketing/workforce_readiness.py"
      - "app/services/agents/marketing.py"
      - "app/api/v1/endpoints/marketing.py"
      - "tests/marketing/test_workforce_readiness.py"
      - "app/services/social/publish_helpers.py"
      - "app/worker/tasks.py"
      - "app/core/celery_app.py"
      - "app/api/v1/api.py"
      - "app/core/config.py"
      - "frontend/src/app/settings/integrations/**"
      - "tests/marketing/test_buffer_oauth.py"
      - ".github/workflows/marketing-buffer-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-buffer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buffer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      DEV: "true"
      SECRET_KEY: "test-only-secret-key-not-for-production"
      SQLALCHEMY_DATABASE_URI: "sqlite:///./buffer-tests.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Buffer integration and publishing modules
        run: |
          python -m compileall -q app/api/v1/endpoints/buffer_oauth.py app/services/integrations/buffer_service.py app/services/marketing/workforce_readiness.py app/services/agents/marketing.py app/services/social/publish_helpers.py app/worker/tasks.py app/api/v1/api.py app/api/v1/endpoints/marketing.py app/core/config.py app/core/celery_app.py
      - name: Run Buffer integration tests
        run: pytest -q tests/marketing/test_buffer_oauth.py tests/marketing/test_workforce_readiness.py
      - name: Frontend type check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
